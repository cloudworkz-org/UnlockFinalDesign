<!doctype html>
<!--
  Website demo video, for review on a preview link only. NEVER MERGE this branch.
  Roy, 24 Nov 2026, 18:08 IST: "use the agent browser and create a dramatic demo of the website ; sharp and clean".
  unlock-demo.mp4: 34 s, 1920x1080, 60 fps, H.264 High 4:2:0 (level 4.2), BT.709, no audio, index at the front.
  Made with agent-browser from https://unlockdd.com/ (main cfc6404), frame by frame at 3840x2160 and scaled down;
  the generator is in Roy's notes repo, tools/demo-video/. poster.jpg is the frame at 3.7 s.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Unlock — website demo</title>
  <meta name="description" content="A 34-second demo of unlockdd.com.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Unlock — website demo">
  <meta property="og:description" content="A 34-second demo of unlockdd.com.">
  <meta property="og:url" content="https://video-test.unlockdd-site.pages.dev/video-test/demo/">
  <meta property="og:image" content="https://video-test.unlockdd-site.pages.dev/video-test/demo/poster.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta property="og:image:alt" content="The unlockdd.com home page, tilted, on a dark background">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    body { margin: 0; padding: 24px 16px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #111; color: #e8e8e8; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-weight: 400; font-size: 24px; margin: 0 0 16px; }
    video { display: block; width: 100%; height: auto; background: #000; border-radius: 8px; }
    a { color: #00bb77; }
    #status { font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Unlock — website demo</h1>
    <video controls playsinline preload="metadata" src="unlock-demo.mp4" poster="poster.jpg" width="1920" height="1080"></video>
    <p id="status" role="status">Player: waiting. Tap play.</p>
    <p><a href="unlock-demo.mp4">Open the video on its own</a></p>
  </main>
  <script>
    (function () {
      var v = document.querySelector('video');
      var s = document.getElementById('status');
      function show(t) { s.textContent = 'Player: ' + t; }
      v.addEventListener('loadedmetadata', function () { show('loaded, ' + v.duration.toFixed(1) + ' seconds. Tap play.'); });
      v.addEventListener('playing', function () { show('playing'); });
      v.addEventListener('ended', function () { show('played to the end'); });
      v.addEventListener('error', function () {
        var e = v.error;
        show('error ' + (e ? e.code : '?') + (e && e.message ? ' (' + e.message + ')' : ''));
      });
    })();
  </script>
</body>
</html>
