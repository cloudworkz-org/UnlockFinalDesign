<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlock · The plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Noto+Serif:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.ul,.ul-dark{--bg0:#1a1a1a;--bg1:#1f1f1f;--card:#2b2b2b;--surf:#333333;--text:#ffffff;--muted:rgba(255,255,255,0.5);--muted2:rgba(255,255,255,0.72);--line:rgba(255,255,255,0.09);--line2:rgba(255,255,255,0.2);--mark:rgba(255,255,255,0.45);--hatch:rgba(255,255,255,0.36);--dot:rgba(255,255,255,0.03);--green-text:#00bb77;--green-mark:#00bb77;--green-fill:rgba(0,187,119,0.12);--amber:#f59e0b;--red:#ef4444;--inv-bg:#ffffff;--inv-text:#0d0d0d;--r-sm:4px;--r-ctl:8px;--r-card:12px;--r-pill:9999px;--font-head:'Aeonik','Inter',system-ui,sans-serif}
.ul-classic{--bg0:#f3f3f1;--bg1:#ebebe8;--card:#ffffff;--surf:#e6e6e2;--text:#0d0d0d;--muted:rgba(13,13,13,0.66);--muted2:rgba(13,13,13,0.8);--line:rgba(13,13,13,0.12);--line2:rgba(13,13,13,0.3);--mark:rgba(13,13,13,0.55);--hatch:rgba(13,13,13,0.4);--dot:rgba(13,13,13,0.05);--green-text:#00704a;--green-mark:#008655;--green-fill:rgba(0,134,85,0.12);--amber:#b45309;--red:#c62828;--inv-bg:#0d0d0d;--inv-text:#ffffff}
.ul-day{--bg0:#f4efe6;--bg1:#ece5d8;--card:#fbf8f2;--surf:#e6dfd0;--text:#1a1a1a;--muted:rgba(26,26,26,0.68);--muted2:rgba(26,26,26,0.82);--line:rgba(26,26,26,0.14);--line2:rgba(26,26,26,0.32);--mark:rgba(26,26,26,0.55);--hatch:rgba(26,26,26,0.4);--dot:rgba(26,26,26,0.05);--green-text:#00704a;--green-mark:#008655;--green-fill:rgba(0,134,85,0.12);--amber:#a14a08;--red:#b3261e;--inv-bg:#1a1a1a;--inv-text:#fbf8f2;--font-head:'Noto Serif JP','Noto Serif',Georgia,serif}
.ul-night{--bg0:#1c1a17;--bg1:#211f1b;--card:#2a2723;--surf:#35312b;--text:#f5f0e6;--muted:rgba(245,240,230,0.56);--muted2:rgba(245,240,230,0.75);--line:rgba(245,240,230,0.1);--line2:rgba(245,240,230,0.22);--mark:rgba(245,240,230,0.45);--hatch:rgba(245,240,230,0.36);--dot:rgba(245,240,230,0.03);--inv-bg:#f5f0e6;--inv-text:#1c1a17;--font-head:'Noto Serif JP','Noto Serif',Georgia,serif}
a{color:var(--text)}a:hover{color:var(--green-text)}
button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--green-text);outline-offset:2px}
.ul-nav,.ul-btn,.ul-card,.ul-th{transition:background-color .15s ease,border-color .15s ease,transform .15s ease}
.ul-nav{position:relative;z-index:1}.ul-nav:hover,.ul-nav:focus-visible{color:var(--green-text) !important;font-weight:600}
.ul-nav svg{transition:stroke .15s ease,stroke-width .15s ease}
.ul-nav:hover svg,.ul-nav:focus-visible svg{stroke:var(--green-text) !important;stroke-width:2.2 !important}
.ul-pill{transition:top .32s cubic-bezier(.22,1,.36,1),height .32s cubic-bezier(.22,1,.36,1),opacity .18s ease}
.ul-tip{transition:opacity .12s ease}
.ul-btn:hover{background:var(--surf) !important;border-color:var(--text) !important;color:var(--text);font-weight:600}
.ul-card:hover{border-color:var(--mark) !important;transform:translateY(-2px)}
.ul-hero-btn{transition:background-color .15s ease}.ul-hero-btn:hover{color:#ffffff;background:#000000 !important;font-weight:600}
.ul-th{background:transparent;color:var(--text)}
.ul-th:hover{background:var(--surf)}
.ul-day [data-th="day"],.ul-night [data-th="night"],.ul-classic [data-th="classic"],.ul-dark [data-th="dark"]{background:var(--inv-bg);color:var(--inv-text)}
.ul-day .ul-logo,.ul-classic .ul-logo{filter:invert(1) brightness(1.15);mix-blend-mode:multiply}
.ul-block,.ul-hero-card,.ul-row{transition:border-color .18s ease,background-color .18s ease,box-shadow .18s ease}
.ul-block:hover{border-color:var(--mark) !important;box-shadow:0 6px 20px rgba(0,0,0,0.14)}
.ul-hero-card:hover{box-shadow:0 10px 28px rgba(0,0,0,0.18)}
.ul-row{margin:0 -8px;padding-left:8px !important;padding-right:8px !important;border-radius:var(--r-sm)}
.ul-row:hover{background:var(--surf)}
@keyframes ul-slide-in{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes ul-fade-in{from{opacity:0}to{opacity:1}}
.ul-panel{animation:ul-slide-in .36s cubic-bezier(.22,1,.36,1)}
.ul-scrim{animation:ul-fade-in .25s ease}
.ul-ghost{transition:background-color .18s ease}.ul-ghost:hover{background:var(--surf) !important;font-weight:600}
@keyframes ul-genie{0%{opacity:0;transform:translateY(14px) scale(.35,.12);clip-path:inset(0 30% 0 30% round 12px)}55%{opacity:1;transform:translateY(2px) scale(.92,.7);clip-path:inset(0 4% 0 4% round 12px)}100%{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 12px)}}
.ul-genie{transform-origin:24px 100%;animation:ul-genie .38s cubic-bezier(.22,1,.36,1)}
.ul-mi{transition:background-color .15s ease}.ul-mi:hover,.ul-mi:focus-visible{background:var(--surf);color:var(--text)}
.ul-chev{transition:transform .25s ease}
@keyframes ul-unlock{0%,86%{transform:translate(0,0)}90%{transform:translate(0,-80px)}93%,96%{transform:translate(-26px,-80px) rotate(-8deg)}99%,100%{transform:translate(0,0)}}
.ul-shackle{transform-box:fill-box;transform-origin:15% 100%;animation:ul-unlock 10s cubic-bezier(.22,1,.36,1) 2s 3}
.nav-min .ul-side{flex:0 0 76px !important;max-width:76px !important;padding:20px 10px !important}
.nav-min .ul-side .ul-nav>span{display:none}
.nav-min .ul-side .ul-nav{justify-content:center;padding:0 !important}
.nav-min .ul-sec{font-size:0 !important;line-height:0;padding:0 !important;margin:10px 8px;border-top:1px solid var(--line)}
.nav-min .ul-logo-full,.nav-min .ul-logodot{display:none !important}
.ul-ic-open{display:none}.nav-min .ul-ic-open{display:block}.nav-min .ul-ic-close{display:none}
.nav-min .ul-logo-o{display:block !important}
.nav-min .ul-logorow{flex-direction:column;align-items:center !important;gap:10px !important;padding:4px 0 12px !important}
.nav-min .ul-collapse{margin-left:0 !important;color:var(--text) !important;background:var(--surf) !important}
.nav-min .ul-prof-text,.nav-min .ul-chev{display:none !important}
.nav-min .ul-prof-btn{justify-content:center;padding:6px !important;border-color:transparent !important;gap:0 !important}
.nav-min .ul-pill{left:10px !important;right:10px !important}
.nav-min .ul-genie{right:auto !important;width:260px}
.nav-min .ul-tipname{display:block !important}
.ul-side{transition:flex-basis .28s cubic-bezier(.22,1,.36,1),max-width .28s cubic-bezier(.22,1,.36,1)}
.ul-crumb ol{align-items:center}.ul-crumb li{display:inline-flex;align-items:center;line-height:1.3;min-height:24px}.ul-crumb li svg{display:block}.ul-crumb a{display:inline-flex;align-items:center;min-height:24px;color:var(--muted);text-decoration:none;transition:color .15s ease}.ul-crumb a:hover,.ul-crumb a:focus-visible{color:var(--green-text);text-decoration:underline;text-underline-offset:3px}.ul-crumb [aria-current="page"]{color:var(--text) !important;font-weight:600}
.ul-table{width:100%;border-collapse:collapse;font-size:15px}
.ul-table th{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 12px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.ul-table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.ul-table tr:hover td{background:var(--surf)}
.ul-table .num{text-align:right;white-space:nowrap}
.ul-table tfoot td{font-weight:600;border-bottom:0}
@keyframes ul-page{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ul-main{animation:ul-page .5s cubic-bezier(.22,1,.36,1) both}
.ul-main>*{animation:ul-page .55s cubic-bezier(.22,1,.36,1) both}
.ul-main>*:nth-child(2){animation-delay:.05s}.ul-main>*:nth-child(3){animation-delay:.1s}.ul-main>*:nth-child(4){animation-delay:.15s}.ul-main>*:nth-child(5){animation-delay:.2s}.ul-main>*:nth-child(n+6){animation-delay:.25s}
.ul-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ul-dg{display:inline-block;height:1.2em;overflow:hidden;vertical-align:top}
.ul-ds{display:block;line-height:1.2;animation:ul-roll-in 1.1s cubic-bezier(.22,1,.36,1) both}
.ul-ds>span{display:block;height:1.2em}
@keyframes ul-roll-in{from{transform:translateY(0)}to{transform:translateY(calc(var(--d) * -1.2em))}}
.ul-ds{transform:translateY(calc(var(--d) * -1.2em))}
.ul-bar-x{transform-origin:0 50%;animation:ul-grow-x .9s cubic-bezier(.22,1,.36,1) both}
.ul-bar-y{transform-origin:50% 100%;animation:ul-grow-y .9s cubic-bezier(.22,1,.36,1) both}
@keyframes ul-grow-x{from{transform:scaleX(0)}to{transform:none}}
@keyframes ul-grow-y{from{transform:scaleY(0)}to{transform:none}}
.ul-chart .ul-bar-y,.ul-chart .ul-bar-x{transition:opacity .18s ease}
.ul-chart:hover .ul-bar-y,.ul-chart:hover .ul-bar-x{opacity:.35}
.ul-chart .ul-col:hover .ul-bar-y,.ul-chart .ul-row-bar:hover .ul-bar-x{opacity:1}
.ul-roll{transition:transform .7s cubic-bezier(.22,1,.36,1)}
.ul-toast{transition:transform .38s cubic-bezier(.22,1,.36,1),height .38s cubic-bezier(.22,1,.36,1),opacity .25s ease,box-shadow .25s ease}

/* wide screens and projectors (1920) */
@media (min-width: 1680px){
.ul{gap:32px !important;padding:32px !important}
.ul .ul-side{max-width:300px !important;flex-basis:280px !important;top:32px !important;min-height:min(calc(100vh - 64px), 1000px) !important}
.ul .ul-main{gap:20px !important;font-size:16px}
.ul h1{font-size:52px !important}
.ul h2{font-size:26px !important}
.ul .ul-hero-card{padding:36px !important;gap:32px 64px !important}
.ul .ul-net{font-size:80px !important}
.ul section.ul-block{padding:24px !important}
.ul .ul-tools > article{flex-basis:420px !important;padding:28px !important}
.ul .ul-tip{width:280px !important;font-size:15px !important}
}
@media (prefers-reduced-motion:reduce){.ul-main,.ul-main>*,.ul-ds,.ul-bar-x,.ul-bar-y{animation:none !important}.ul-side{transition:none}.ul-shackle{animation:none}.ul-genie{animation:none}.ul-chev{transition:none}.ul-panel,.ul-scrim{animation:none}.ul-block,.ul-hero-card,.ul-row{transition:none}.ul-roll{transition:none}.ul-toast{transition:opacity .01s}.ul-pill,.ul-tip{transition:opacity .01s}.ul-nav,.ul-btn,.ul-card,.ul-th{transition:none}.ul-card:hover{transform:none}}

/* page styles */
@keyframes lab-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lab-in{animation:lab-in .45s cubic-bezier(.22,1,.36,1) both}
.lab-rise{animation:lab-in .5s cubic-bezier(.22,1,.36,1) both}
.lab-grow{transition:width .6s cubic-bezier(.22,1,.36,1)}
@keyframes lab-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lab-bar{transform-origin:0 50%;animation:lab-bar .9s cubic-bezier(.22,1,.36,1) both}
@keyframes lab-big{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.lab-big{display:inline-block;animation:lab-big .6s cubic-bezier(.22,1,.36,1) both}
.lab-slot{transition:top .6s cubic-bezier(.22,1,.36,1),background-color .3s ease,border-color .3s ease}
@keyframes lab-pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:none}}
.lab-pop{animation:lab-pop .4s cubic-bezier(.22,1,.36,1) both}
@keyframes lab-flash{0%{background-color:rgba(245,158,11,.28)}100%{background-color:transparent}}
.lab-flash{animation:lab-flash 1.6s ease both}
.lab-ink{transition:left .4s cubic-bezier(.22,1,.36,1),opacity .2s ease}
.lab-tab{transition:color .15s ease}
.lab-tab:hover{color:var(--green-text) !important}
.lab-opt{transition:background-color .25s ease,color .25s ease}
.lab-opt:hover{outline:1px solid var(--line2)}
.lab-go:hover{background:#33cc92 !important;border-color:#33cc92 !important;color:#0d0d0d !important}
.lab-split{transition:flex-basis .7s cubic-bezier(.22,1,.36,1)}
.lab-split-knob{transition:left .7s cubic-bezier(.22,1,.36,1)}
.lab-count{display:inline-block;min-width:1.4em;text-align:right}
@keyframes lab-toast{from{opacity:0;transform:translate(-50%,-24px)}to{opacity:1;transform:translate(-50%,0)}}
.lab-toast{transform:translate(-50%,0);animation:lab-toast .45s cubic-bezier(.22,1,.36,1) both}
@keyframes qs-type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.qs-type{display:inline-block;animation:qs-type .8s steps(22,end) both}
@keyframes qs-ping{0%{box-shadow:0 0 0 0 rgba(245,158,11,.6)}100%{box-shadow:0 0 0 12px rgba(245,158,11,0)}}
.qs-ping{animation:qs-ping 1.6s ease-out 4}
@keyframes qs-ring{0%{box-shadow:0 0 0 0 rgba(0,187,119,.7)}70%{box-shadow:0 0 0 10px rgba(0,187,119,0)}100%{box-shadow:0 0 0 0 rgba(0,187,119,0)}}
.spot{animation:qs-ring 1.9s ease-out infinite}
@keyframes qs-hl{from{background-size:0 100%}to{background-size:100% 100%}}
.qs-hl{background-image:linear-gradient(var(--green-fill),var(--green-fill));background-repeat:no-repeat;background-position:left;background-size:0 100%;animation:qs-hl .6s ease both;border-bottom:1px solid var(--green-text)}
@keyframes qs-spin{to{transform:rotate(360deg)}}
.qs-spin{animation:qs-spin .9s linear infinite;transform-origin:50% 50%}
@keyframes qs-tick{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:none}}
.qs-tick{animation:qs-tick .4s cubic-bezier(.22,1,.36,1) both}
@keyframes qs-slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.qs-slide{animation:qs-slide .5s cubic-bezier(.22,1,.36,1) both}
.qs-seg{transition:background-color .25s ease,border-color .25s ease}
.qs-seg:hover{border-color:var(--mark) !important}
@keyframes dd-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.dd-row{animation:dd-in .4s cubic-bezier(.22,1,.36,1) both}
@keyframes dd-pop{0%{opacity:0;transform:translateX(24px) scale(.94)}100%{opacity:1;transform:none}}
.dd-pop{animation:dd-pop .5s cubic-bezier(.22,1,.36,1) .3s both}
@keyframes plan-out{0%{transform:translateX(0);opacity:1}60%{opacity:1}100%{transform:translateX(150%);opacity:0}}
.plan-out{animation:plan-out 1.6s cubic-bezier(.22,1,.36,1) .5s both}
@keyframes plan-in{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}}
.plan-in{animation:plan-in .6s cubic-bezier(.22,1,.36,1) 1.6s both}
</style>
</head>
